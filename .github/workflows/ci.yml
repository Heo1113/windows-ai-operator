name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux - build (incl. WPF compile) and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WindowsAiOperator.slnx -c Release

      - name: Unit tests (mock desktop, policy, planner, storage)
        timeout-minutes: 10
        run: dotnet test --project tests/WindowsAiOperator.Tests -c Release --no-build

  windows:
    name: Windows x64 - build, unit tests, real UIA tests, portable package, GUI smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WindowsAiOperator.slnx -c Release

      - name: Unit tests
        timeout-minutes: 10
        run: dotnet test --project tests/WindowsAiOperator.Tests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Real UI Automation tests (test app and Notepad on the runner desktop)
        timeout-minutes: 15
        run: dotnet test --project tests/WindowsAiOperator.UiaTests -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: warn
          retention-days: 30
